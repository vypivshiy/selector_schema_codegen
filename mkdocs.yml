site_name: ssc_codegen
site_description: KDL-based DSL compiler and parser generator for web scraping and REST APIs
repo_url: https://github.com/vypivshiy/selector_schema_codegen
repo_name: vypivshiy/selector_schema_codegen

theme:
  name: material
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [.]
          options:
            docstring_style: google
            docstring_section_style: table
            show_root_heading: true
            show_root_toc_entry: true
            show_category_heading: true
            show_source: true
            signature_crossrefs: true
            separate_signature: true
            members: true
            show_symbol_type_heading: true
            show_symbol_type_toc: true

markdown_extensions:
  - mkdocs_click
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - toc:
      permalink: true

nav:
  - Overview: README.md
  - Tutorials & Guides:
      - Quick Start: guide.md
      - Syntax: syntax.md
      - Operations: operations.md
      - Types: types.md
      - Predicates: predicates.md
      - JSON Schemas: json.md
      - Extensions: extensions.md
      - Learn Series:
          - Overview: learn/overview.md
          - 01 Generation: learn/01-generation.md
          - 02 Fields: learn/02-fields.md
          - 03 Check: learn/03-check.md
          - 04 Run: learn/04-run.md
          - 05 Health: learn/05-health.md
          - 06 Recipes: learn/06-recipes.md
          - 07 Define: learn/07-define.md
          - 08 Scout: learn/08-scout.md
          - 09 Imports: learn/09-imports.md
          - 10 Request: learn/10-request.md
          - 11 Filters: learn/11-filters.md
          - 12 Asserts: learn/12-asserts.md
  - Maintainers & Architecture:
      - AST Specification: maintainers/ast_spec.md
      - Converters & Backends: maintainers/converters.md
      - KdlQuery Integration: maintainers/kdlquery.md
      - Linter: maintainers/linter.md
  - Architecture Decisions (ADR):
      - 0001 JSON Key Alias: adr/0001-json-key-alias-remapping.md
      - 0002 API Reference & Griffe: adr/0002-api-reference-mkdocs-griffe.md
  - API Reference:
      - Public Facade: api/index.md
      - CLI Reference: api/cli.md
      - AST Nodes: api/ast.md
      - Compiler Core: api/core.md
      - Traversal Engine: api/traversal.md
      - Target Converters: api/targets.md
