[project]
name = "ssc_codegen"
version = "0.36.1"
description = "Python-dsl code converter to html parser for web scraping "
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "bs4>=0.0.2",
    "colorama>=0.4.6 ; sys_platform == 'win32'",
    "cssselect>=1.2.0",
    "lxml>=5.3.0",
    "soupsieve>=2.6",
    "typer>0.26",
    "typing_extensions;python_version<'3.11'",
    "kdlquery>=1.3.0",
    "httpx>=0.28.1",
]

classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Topic :: Software Development :: Code Generators",
    "Topic :: Text Processing :: Markup :: HTML",
    "Topic :: Utilities",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

[project.urls]
Documentation = "https://github.com/vypivshiy/selector_schema_codegen#readme"
Issues = "https://github.com/vypivshiy/selector_schema_codegen/issues"
Source = "https://github.com/vypivshiy/selector_schema_codegen"
Examples = "https://github.com/vypivshiy/selector_schema_codegen/examples"


[project.scripts]
ssc-gen = 'ssc_codegen.main:main'

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.sdist]
include = [
  "ssc_codegen/**",
]

[tool.hatch.build.targets.wheel]
packages = ["ssc_codegen"]

[dependency-groups]
dev = [
    "aiohttp>=3.9,<3.12",  # aioresponses 0.7.x breaks on 3.12+ (stream_writer)
    "aioresponses>=0.7",
    "bs4>=0.0.2",
    "coverage>=7.6.12",
    "httpx>=0.28.1",
    "hypothesis>=6.151.9",
    "lxml>=5.3.0",
    "mypy>=1.14.1",
    "parsel>=1.9.1",
    "pytest>=8.3.4",
    "respx>=0.23.1",
    "responses>=0.25",
    "ruff>=0.9.3",
    "selectolax>=0.3.27",
]

[tool.ruff]
target-version = "py310"
line-length = 80
exclude = ["__init__.py"]

[tool.mypy]
python_version = "3.10"
show_error_codes = true
exclude = [
    "ssc_codegen/ast"  # ignore built-in ast and project ast

]
[[tool.mypy.overrides]]
module="tests.*"
disallow_untyped_defs = false


[[tool.mypy.overrides]]
module = ["colorama", "lxml", "lxml.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# Large visitor classes with match statements may need relaxed return checks
module = ["ssc_codegen.targets.python.visitor", "ssc_codegen.targets.javascript.visitor"]
disable_error_code = ["return", "return-value"]


[tool.coverage.report]
exclude_also = [
    'def __repr__',
    'if self.debug:',
    'if settings.DEBUG',
    'raise AssertionError',
    'raise NotImplementedError',
    'if 0:',
    'if __name__ == .__main__.:',
    'if TYPE_CHECKING:',
    'class .*\bProtocol\):',
    '@(abc\.)?abstractmethod',
]

[tool.coverage.run]
source = ["ssc_codegen"]
omit = [
    "*/.venv/*",
    "*/scripts/*",
    "*/tests/*"
]
